name: Test build (PR #1)

# Builds installable artifacts for an unmerged branch and publishes them as a
# GitHub pre-release, so PR #1 can be field tested before anyone decides to
# merge it. A GitHub Release only needs a tag, and a tag can point at any
# commit, so nothing here touches master.
#
# Deliberately narrower than release.yml: Windows x64, Linux x64 and Linux
# ARM64 only, no macOS, and no mirror push to the public repo.

on:
  push:
    branches: ["testbuild/**"]
  workflow_dispatch:

concurrency:
  group: testbuild-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The version is upstream's, from CMakeLists.txt, plus -m0lte and the short
  # commit. Upstream's part says which WSJT-X this is; -m0lte says it is not
  # upstream's build; the commit says exactly which one, so two test builds a
  # day apart can be told apart from the filename alone. The same string goes
  # into the binary, so Help > About and the title bar agree with the file the
  # tester downloaded.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      suffix: ${{ steps.v.outputs.suffix }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: |
          BASE=$(grep -E '^\s*VERSION\s+[0-9]' CMakeLists.txt | head -1 | awk '{print $2}' | cut -d. -f1-3)
          if [ -z "$BASE" ]; then
            echo "::error::Could not derive VERSION from CMakeLists.txt"
            exit 1
          fi
          SUFFIX="-m0lte-${GITHUB_SHA:0:7}"
          {
            echo "version=${BASE}${SUFFIX}"
            echo "suffix=${SUFFIX}"
            echo "tag=v${BASE}${SUFFIX}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${BASE}${SUFFIX}"

  linux:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      version_suffix: ${{ needs.prepare.outputs.suffix }}
      hamlib_branch: "4.7.1"
      arch: "x86_64"

  linux-arm:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      version_suffix: ${{ needs.prepare.outputs.suffix }}
      hamlib_branch: "4.7.1"
      arch: "aarch64"

  windows:
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      version_suffix: ${{ needs.prepare.outputs.suffix }}
      hamlib_branch: "4.7.1"

  release:
    needs: [prepare, linux, linux-arm, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      # A build job can exit 0 without having packaged anything (a step behind
      # an if: that evaluated false, an upload that matched no files). Check
      # for the installers themselves before publishing, so a partial release
      # never reaches the download page.
      - name: Verify installer artifacts
        run: |
          shopt -s nullglob
          labels=(
            "Windows x64 installer"
            "Linux x64 AppImage"
            "Linux x64 .deb"
            "Linux x64 .rpm"
            "Linux ARM64 AppImage"
            "Linux ARM64 .deb"
            "Linux ARM64 .rpm"
          )
          patterns=(
            "artifacts/wsjtx-${BUILD_VERSION}-windows-x86_64-installer/*.exe"
            "artifacts/wsjtx-${BUILD_VERSION}-linux-x86_64-AppImage/*.AppImage"
            "artifacts/wsjtx-${BUILD_VERSION}-linux-x86_64-deb/*.deb"
            "artifacts/wsjtx-${BUILD_VERSION}-linux-x86_64-rpm/*.rpm"
            "artifacts/wsjtx-${BUILD_VERSION}-linux-aarch64-AppImage/*.AppImage"
            "artifacts/wsjtx-${BUILD_VERSION}-linux-aarch64-deb/*.deb"
            "artifacts/wsjtx-${BUILD_VERSION}-linux-aarch64-rpm/*.rpm"
          )
          missing=0
          : > assets.txt
          for i in "${!labels[@]}"; do
            # shellcheck disable=SC2206 # word-split is intentional; nullglob makes it safe.
            matches=( ${patterns[$i]} )
            if [ ${#matches[@]} -eq 0 ]; then
              echo "::error::MISSING  ${labels[$i]} - no match for ${patterns[$i]}"
              missing=$((missing + 1))
            else
              for m in "${matches[@]}"; do
                printf '  ok  %-24s %s (%s bytes)\n' "${labels[$i]}" "$m" "$(stat --printf '%s' "$m")"
                echo "$m" >> assets.txt
              done
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing artifact(s) missing - refusing to publish a partial test build."
            exit 1
          fi

      - name: Checksums
        run: |
          mapfile -t files < assets.txt
          sha256sum "${files[@]}" | sed 's#artifacts/[^/]*/##' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "SHA256SUMS.txt" >> assets.txt

      - name: Write release notes
        env:
          SHA: ${{ github.sha }}
        run: |
          sed -e "s|@SHA@|${SHA}|g" -e "s|@VERSION@|${BUILD_VERSION}|g" \
            .github/testbuild-notes.md > notes.md
          cat notes.md

      # The tag is created here, at this commit, by gh. master is not involved.
      # Deleting first makes a re-run of the same commit idempotent rather than
      # a failure; a different commit gets a different tag and its own release.
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          mapfile -t files < assets.txt
          gh release create "$RELEASE_TAG" \
            --target "$SHA" \
            --title "WSJT-X ${BUILD_VERSION} (PR #1 test build)" \
            --notes-file notes.md \
            --prerelease \
            "${files[@]}"
          echo "Published: $(gh release view "$RELEASE_TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
